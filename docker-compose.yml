services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ebeautysalon-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-Your_password123}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    networks:
      - ebeautysalon-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ebeautysalon-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:-user}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-password}"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ebeautysalon-net

  api:
    build:
      context: ./backend
      dockerfile: eBeautySalon.API/Dockerfile
    container_name: ebeautysalon-api
    env_file:
      - .env
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - ebeautysalon-net

  worker:
    build:
      context: ./backend
      dockerfile: eBeautySalon.Worker/Dockerfile
    container_name: ebeautysalon-worker
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - api
    networks:
      - ebeautysalon-net

networks:
  ebeautysalon-net:
    driver: bridge
